[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-processing-extract-interesting-facts"
version = "1.0.0"
description = "Dutch linguistic facts extraction package for nl_processing"
requires-python = ">=3.12"
dependencies = [
  "nl-processing-core",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.3,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nl_processing.extract_interesting_facts*"]
namespaces = true

[tool.setuptools.package-data]
"nl_processing.extract_interesting_facts.prompts" = ["*.json"]

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-xdist>=3.8.0,<4",
  "ruff>=0.15.0,<0.16",
  "pylint>=4.0.4,<5",
  "vulture>=2.14.0,<3",
]

[tool.uv.sources]
nl-processing-core = { path = "../core" }