[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-processing-extract-word-details"
version = "1.0.0"
description = "Word details extraction package for nl_processing"
requires-python = ">=3.12"
dependencies = [
  "nl-processing-core",
  "nl-processing-database",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "pydantic>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nl_processing.extract_word_details*"]
namespaces = true

[tool.setuptools.package-data]
"nl_processing.extract_word_details.prompts" = ["*.json"]

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-xdist>=3.8.0,<4",
  "pytest-mock>=3.15.1,<4",
  "ruff>=0.15.0,<0.16",
  "pylint>=4.0.4,<5",
  "vulture>=2.14.0,<3",
]

[tool.uv.sources]
nl-processing-core = { path = "../core" }
nl-processing-database = { path = "../database" }
